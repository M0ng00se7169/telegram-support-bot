networks:
  backend:
    driver: bridge


services:
  bot_consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: "bot-faststream"
    environment:
      KAFKA_URL: kafka:29092

    ports:
      - "7000:8000"
    volumes:
      - ../app/:/app/
      - ../.env:/app/.env

    networks:
      - backend

    command: "faststream run --factory consumers.main:get_app --reload"

